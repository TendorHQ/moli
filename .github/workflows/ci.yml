name: CI frontend stall diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-stall-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Original frontend gate / diagnostic ${{ matrix.trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined
    steps:
      - name: Checkout exact failing source
        uses: actions/checkout@v4
        with:
          ref: 9f0a8736381a8cfc3040f97f43fc2bc85d471f42
          persist-credentials: false
      - name: Checkout diagnostic observer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          sparse-checkout: .github/scripts/frontend-diagnostic.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download exact original release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: moli-release-head
          run-id: 39642144763
          github-token: ${{ github.token }}
          path: target/ci-artifacts/head
      - name: Verify original release
        run: .github/scripts/unpack-ci-release.sh head 9f0a8736381a8cfc3040f97f43fc2bc85d471f42
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.14
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - name: Install debugger
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gdb
      - name: Install dependencies and build unchanged fixtures
        run: |
          uv sync --project moli-frontend-smoke --locked
          uv sync --project moli-cdp-smoke --locked
          npm ci --prefix moli-frontend-smoke
          npm run build --prefix moli-frontend-smoke
          uv run --project moli-frontend-smoke --no-sync python -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("moli-frontend-smoke/dist/manifest.json").read_bytes()).hexdigest() == "3e0333512288b82ddfa7ce7b7ea4c98eac7b5b165dba792a24885f5a756ef0db"'
      - name: Resolve exact Chromium
        id: chromium
        shell: bash
        run: |
          set -euo pipefail
          chromium_bin=$(uv run --project moli-cdp-smoke --no-sync python -c \
            'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          test -x "$chromium_bin"
          wrapper="$PWD/target/ci-bin/chromium-ci"
          printf '%s\n' '#!/bin/sh' "exec \"$chromium_bin\" --no-sandbox \"\$@\"" > "$wrapper"
          chmod 0755 "$wrapper"
          echo "binary=$wrapper" >> "$GITHUB_OUTPUT"
      - name: Run original complete gate with observational tracing
        id: frontend
        continue-on-error: true
        env:
          MOLI_CDP_NAV_TIMING: '1'
          MOLI_FRONTEND_SMOKE_TRACE_BG: '1'
        shell: bash
        run: |
          set -euo pipefail
          uv run --project moli-frontend-smoke --no-sync python \
            diagnostic-source/.github/scripts/frontend-diagnostic.py \
            --chromium-bin "${{ steps.chromium.outputs.binary }}" \
            --moli-bin "$PWD/target/ci-bin/moli-release-head/moli" \
            --timeout-ms 30000 --reference-infrastructure-retries 1 \
            --output target/frontend-diagnostic > target/frontend-diagnostic.log 2>&1
      - name: Validate original artifacts
        id: analysis
        if: always() && steps.frontend.outcome != 'skipped'
        continue-on-error: true
        run: uv run --project moli-frontend-smoke --no-sync moli-frontend-smoke-analyze results target/frontend-diagnostic
      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-stall-diagnostic-${{ matrix.trial }}
          path: |
            target/frontend-diagnostic
            target/frontend-diagnostic.log
          retention-days: 7
      - name: Require original gates
        if: always()
        env:
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          test "$FRONTEND_OUTCOME" = success
          test "$ANALYSIS_OUTCOME" = success
