name: Tendor release

on:
  push:
    tags:
      - 'v*-tendor.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Free build space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build in Debian trixie
        run: |
          docker run --rm -v "$PWD:/src" -w /src rust:1.96.1-trixie bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends cmake libclang-dev libfontconfig1-dev
            git config --global --add safe.directory /src
            cargo build --locked --release -p moli --bin moli -j 2
            mkdir -p dist
            cp target/release/moli dist/moli-linux-x86_64
            cd dist
            sha256sum moli-linux-x86_64 > SHA256SUMS
          '
      - name: Publish source-built assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/moli-linux-x86_64 dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes "Linux x86_64; Rust 1.96.1; Debian trixie. Source: $GITHUB_SHA."
